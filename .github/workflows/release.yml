name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  pre_release:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - name: install pinned host toolchain
        shell: bash
        run: |
          set -euo pipefail
          tool_lock="${GITHUB_WORKSPACE}/offline/toolchain.lock.tsv"
          tool_root="${GITHUB_WORKSPACE}/.tmp/toolchain"
          host_arch="amd64"

          lookup_tool_field() {
            local artifact_id="$1"
            local field_name="$2"
            awk -F '\t' -v artifact_id="$artifact_id" -v field_name="$field_name" '
              /^#/ || NF == 0 { next }
              $1 == "id" {
                for (i = 1; i <= NF; i++) {
                  idx[$i] = i
                }
                next
              }
              $1 == artifact_id {
                print $(idx[field_name])
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            ' "$tool_lock"
          }

          download_bootstrap_tool() {
            local artifact_id="$1"
            local url sha dest
            url="$(lookup_tool_field "$artifact_id" source_url)"
            sha="$(lookup_tool_field "$artifact_id" sha256)"
            dest="$tool_root/downloads/$artifact_id/$(basename "$url")"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL "$url" -o "$dest"
            if [[ "$(sha256sum "$dest" | awk '{print $1}')" != "$sha" ]]; then
              echo "::error::bootstrap tool sha256 mismatch for ${artifact_id}"
              exit 1
            fi
            printf '%s\n' "$dest"
          }

          bootstrap_go() {
            local artifact_id archive_path extract_root
            artifact_id="go-linux-${host_arch}"
            archive_path="$(download_bootstrap_tool "$artifact_id")"
            extract_root="$tool_root/extracted/$artifact_id"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "$archive_path" -C "$extract_root"
            printf '%s\n' "$extract_root/go/bin/go"
          }

          go_bin="$(bootstrap_go)"
          "$go_bin" run -mod=readonly ./cmd/jcs-offline-replay sync-toolchain \
            --lock "$tool_lock" \
            --output-dir "$tool_root" \
            --env-file "$tool_root/env.sh" \
            --host-arch "$host_arch" \
            --purposes build,provision,workflow-json-query >/dev/null
          # shellcheck disable=SC1090
          source "$tool_root/env.sh"

          {
            echo "PATH=$(dirname "$JCS_TOOL_GO"):$(dirname "$JCS_TOOL_JQ"):$(dirname "$JCS_TOOL_TOFU"):$PATH"
            echo "JCS_TOOL_GO=$JCS_TOOL_GO"
            echo "JCS_TOOL_JQ=$JCS_TOOL_JQ"
            echo "JCS_TOOL_TOFU=$JCS_TOOL_TOFU"
          } >> "$GITHUB_ENV"
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1 -timeout=20m
      - name: race tests
        run: go test ./... -race -count=1 -timeout=25m
      - name: conformance
        run: go test ./conformance -count=1 -timeout=10m -v
      - name: official ES6 100M checksum gate
        env:
          JCS_OFFICIAL_ES6_ENABLE_100M: "1"
        run: go test ./conformance -run TestOfficialES6CorpusChecksums100M -count=1 -timeout=6h -v
      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.64.8
          args: --config=golangci.yml
      - name: fuzz jcstoken
        run: go test ./jcstoken -run=^$ -fuzz=FuzzParseCanonicalRoundTrip -fuzztime=30s
      - name: fuzz jcsfloat
        run: go test ./jcsfloat -run=^$ -fuzz=FuzzFormatDoubleRoundTrip -fuzztime=30s

  server_evidence:
    name: Server Evidence
    needs: pre_release
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STATE_MODE: remote
      STATE_BUCKET: ${{ vars.JCS_AWS_STATE_BUCKET }}
      STATE_REGION: ${{ vars.JCS_AWS_STATE_REGION }}
      STATE_LOCK_TABLE: ${{ vars.JCS_AWS_STATE_LOCK_TABLE }}
      STATE_KEY: server-evidence/${{ github.ref_name }}/terraform.tfstate
      AWS_ROLE_TO_ASSUME: ${{ vars.JCS_AWS_RELEASE_ROLE_ARN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - name: install pinned host toolchain
        shell: bash
        run: |
          set -euo pipefail
          tool_lock="${GITHUB_WORKSPACE}/offline/toolchain.lock.tsv"
          tool_root="${GITHUB_WORKSPACE}/.tmp/toolchain-server-evidence"
          host_arch="amd64"

          lookup_tool_field() {
            local artifact_id="$1"
            local field_name="$2"
            awk -F '\t' -v artifact_id="$artifact_id" -v field_name="$field_name" '
              /^#/ || NF == 0 { next }
              $1 == "id" {
                for (i = 1; i <= NF; i++) {
                  idx[$i] = i
                }
                next
              }
              $1 == artifact_id {
                print $(idx[field_name])
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            ' "$tool_lock"
          }

          download_bootstrap_tool() {
            local artifact_id="$1"
            local url sha dest
            url="$(lookup_tool_field "$artifact_id" source_url)"
            sha="$(lookup_tool_field "$artifact_id" sha256)"
            dest="$tool_root/downloads/$artifact_id/$(basename "$url")"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL "$url" -o "$dest"
            if [[ "$(sha256sum "$dest" | awk '{print $1}')" != "$sha" ]]; then
              echo "::error::bootstrap tool sha256 mismatch for ${artifact_id}"
              exit 1
            fi
            printf '%s\n' "$dest"
          }

          bootstrap_go() {
            local artifact_id archive_path extract_root
            artifact_id="go-linux-${host_arch}"
            archive_path="$(download_bootstrap_tool "$artifact_id")"
            extract_root="$tool_root/extracted/$artifact_id"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "$archive_path" -C "$extract_root"
            printf '%s\n' "$extract_root/go/bin/go"
          }

          go_bin="$(bootstrap_go)"
          "$go_bin" run -mod=readonly ./cmd/jcs-offline-replay sync-toolchain \
            --lock "$tool_lock" \
            --output-dir "$tool_root" \
            --env-file "$tool_root/env.sh" \
            --host-arch "$host_arch" \
            --purposes build,provision,workflow-json-query >/dev/null
          # shellcheck disable=SC1090
          source "$tool_root/env.sh"

          {
            echo "PATH=$(dirname "$JCS_TOOL_GO"):$(dirname "$JCS_TOOL_JQ"):$(dirname "$JCS_TOOL_TOFU"):$PATH"
            echo "JCS_TOOL_GO=$JCS_TOOL_GO"
            echo "JCS_TOOL_JQ=$JCS_TOOL_JQ"
            echo "JCS_TOOL_TOFU=$JCS_TOOL_TOFU"
          } >> "$GITHUB_ENV"
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: server-evidence
        shell: bash
        run: ./scripts/release-server.sh
        env:
          TAG: ${{ github.ref_name }}
      - name: resolve evidence source metadata
        id: evidence-source
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="offline/runs/releases/${GITHUB_REF_NAME}/x86_64/offline-evidence.json"
          if [[ ! -f "${evidence_path}" ]]; then
            echo "::error::missing offline evidence: ${evidence_path}"
            exit 1
          fi

          commit="$(jq -r '.source_git_commit // empty' "${evidence_path}")"
          tag="$(jq -r '.source_git_tag // empty' "${evidence_path}")"
          if [[ -z "${commit}" || -z "${tag}" ]]; then
            echo "::error::offline evidence missing source_git_commit/source_git_tag"
            exit 1
          fi
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::offline evidence source_git_commit is not a full SHA: ${commit}"
            exit 1
          fi
          if [[ "${tag}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::offline evidence source_git_tag ${tag} does not match release tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${commit}"
          fi

          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: build release control binary for offline evidence gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/release-offline-control
          source_tree=".tmp/release-offline-source"
          control_binary="${GITHUB_WORKSPACE}/.tmp/release-offline-control/jcs-canon"
          rm -rf "${source_tree}"

          cleanup() {
            git worktree remove --force "${source_tree}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "${source_tree}" "${{ steps.evidence-source.outputs.commit }}"
          (
            cd "${source_tree}"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
              -o "${control_binary}-x86_64" ./cmd/jcs-canon
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
              -o "${control_binary}-arm64" ./cmd/jcs-canon
          )
      - name: resolve x86_64 evidence gate inputs
        id: gate-x86
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/x86_64/offline-evidence.json"
          schema="$(jq -r '.schema_version // empty' "${evidence_path}")"
          if [[ "${schema}" != "evidence.v1" ]]; then
            echo "::error::x86_64 release evidence must be evidence.v1, got ${schema}"
            exit 1
          fi
          echo "matrix=${GITHUB_WORKSPACE}/offline/matrix.server-x86_64.yaml" >> "$GITHUB_OUTPUT"
          echo "profile=${GITHUB_WORKSPACE}/offline/profiles/server-linux-x86_64.yaml" >> "$GITHUB_OUTPUT"
          echo "infra_manifest=${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/infra-manifest.v1.json" >> "$GITHUB_OUTPUT"
      - name: resolve arm64 evidence gate inputs
        id: gate-arm64
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/arm64/offline-evidence.json"
          schema="$(jq -r '.schema_version // empty' "${evidence_path}")"
          if [[ "${schema}" != "evidence.v1" ]]; then
            echo "::error::arm64 release evidence must be evidence.v1, got ${schema}"
            exit 1
          fi
          echo "matrix=${GITHUB_WORKSPACE}/offline/matrix.server-arm64.yaml" >> "$GITHUB_OUTPUT"
          echo "profile=${GITHUB_WORKSPACE}/offline/profiles/server-linux-arm64.yaml" >> "$GITHUB_OUTPUT"
          echo "infra_manifest=${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/infra-manifest.v1.json" >> "$GITHUB_OUTPUT"
      - name: offline evidence gate x86_64
        env:
          JCS_OFFLINE_EVIDENCE: ${{ github.workspace }}/offline/runs/releases/${{ github.ref_name }}/x86_64/offline-evidence.json
          JCS_OFFLINE_BUNDLE: ${{ github.workspace }}/offline/runs/releases/${{ github.ref_name }}/x86_64/offline-bundle.tgz
          JCS_OFFLINE_CONTROL_BINARY: ${{ github.workspace }}/.tmp/release-offline-control/jcs-canon-x86_64
          JCS_OFFLINE_MATRIX: ${{ steps.gate-x86.outputs.matrix }}
          JCS_OFFLINE_PROFILE: ${{ steps.gate-x86.outputs.profile }}
          JCS_OFFLINE_EXPECTED_GIT_COMMIT: ${{ steps.evidence-source.outputs.commit }}
          JCS_OFFLINE_EXPECTED_GIT_TAG: ${{ steps.evidence-source.outputs.tag }}
          JCS_OFFLINE_INFRA_MANIFEST: ${{ steps.gate-x86.outputs.infra_manifest }}
        run: go test ./offline/conformance -run TestOfflineReplayEvidenceReleaseGate -count=1 -v
      - name: offline evidence gate arm64
        env:
          JCS_OFFLINE_EVIDENCE: ${{ github.workspace }}/offline/runs/releases/${{ github.ref_name }}/arm64/offline-evidence.json
          JCS_OFFLINE_BUNDLE: ${{ github.workspace }}/offline/runs/releases/${{ github.ref_name }}/arm64/offline-bundle.tgz
          JCS_OFFLINE_CONTROL_BINARY: ${{ github.workspace }}/.tmp/release-offline-control/jcs-canon-arm64
          JCS_OFFLINE_MATRIX: ${{ steps.gate-arm64.outputs.matrix }}
          JCS_OFFLINE_PROFILE: ${{ steps.gate-arm64.outputs.profile }}
          JCS_OFFLINE_EXPECTED_GIT_COMMIT: ${{ steps.evidence-source.outputs.commit }}
          JCS_OFFLINE_EXPECTED_GIT_TAG: ${{ steps.evidence-source.outputs.tag }}
          JCS_OFFLINE_INFRA_MANIFEST: ${{ steps.gate-arm64.outputs.infra_manifest }}
        run: go test ./offline/conformance -run TestOfflineReplayEvidenceReleaseGate -count=1 -v
      - name: fetch governance lock from jcs-governance
        shell: bash
        run: |
          set -euo pipefail
          # The governance lock is owned by jcs-governance, not json-canon.
          # Clone the governance umbrella at HEAD main to get the authoritative lock file.
          gov_umbrella="${GITHUB_WORKSPACE}/.tmp/jcs-governance-lock"
          rm -rf "${gov_umbrella}"
          git clone --no-tags --depth=1 \
            https://github.com/lattice-substrate/jcs-governance.git \
            "${gov_umbrella}"
          if [[ ! -f "${gov_umbrella}/governance.lock.json" ]]; then
            echo "::error::governance.lock.json not found in jcs-governance"
            exit 1
          fi
          echo "GOV_LOCK_FILE=${gov_umbrella}/governance.lock.json" >> "$GITHUB_ENV"
      - name: checkout pinned governance repos
        shell: bash
        run: |
          set -euo pipefail
          lock_file="${GOV_LOCK_FILE}"
          gov_root="${GITHUB_WORKSPACE}/.tmp/governance"
          mkdir -p "${gov_root}"
          for repo in jcs-spec jcs-contracts jcs-conformance-harness jcs-integration-tests; do
            url="$("$JCS_TOOL_JQ" -r --arg repo "$repo" '.repositories[$repo].url' "${lock_file}")"
            commit="$("$JCS_TOOL_JQ" -r --arg repo "$repo" '.repositories[$repo].commit' "${lock_file}")"
            dest="${gov_root}/${repo}"
            rm -rf "${dest}"
            git clone --no-tags --depth=1 "${url}" "${dest}"
            (
              cd "${dest}"
              git fetch --no-tags --depth=1 origin "${commit}"
              git checkout --detach "${commit}"
            )
          done
      - name: spec implementation parity check
        shell: bash
        run: |
          set -euo pipefail
          gov_root="${GITHUB_WORKSPACE}/.tmp/governance"
          # Independently verify that jcs-spec's positive vector expectations match
          # this implementation as a black-box oracle. This is the governance layer
          # certifying semantic correctness, not implementation-private test coverage.
          "$JCS_TOOL_GO" run "${gov_root}/jcs-spec/go/cmd/jcs-spec" validate-implementation \
            --spec-root "${gov_root}/jcs-spec" \
            --impl-root "${GITHUB_WORKSPACE}"
      - name: governed release gate
        shell: bash
        run: |
          set -euo pipefail
          gov_root="${GITHUB_WORKSPACE}/.tmp/governance"
          "$JCS_TOOL_GO" run "${gov_root}/jcs-integration-tests/cmd/jcs-integration" release-gate \
            --spec "${gov_root}/jcs-spec" \
            --impl "${GITHUB_WORKSPACE}" \
            --contracts "${gov_root}/jcs-contracts" \
            --conformance "${gov_root}/jcs-conformance-harness" \
            --integration "${gov_root}/jcs-integration-tests" \
            --required-profile "official-cloud-measured-release" \
            --evidence-x86 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/x86_64/offline-evidence.json" \
            --bundle-x86 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/x86_64/offline-bundle.tgz" \
            --control-binary-x86 "${GITHUB_WORKSPACE}/.tmp/release-offline-control/jcs-canon-x86_64" \
            --matrix-x86 "${{ steps.gate-x86.outputs.matrix }}" \
            --profile-x86 "${{ steps.gate-x86.outputs.profile }}" \
            --evidence-arm64 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/arm64/offline-evidence.json" \
            --bundle-arm64 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/arm64/offline-bundle.tgz" \
            --control-binary-arm64 "${GITHUB_WORKSPACE}/.tmp/release-offline-control/jcs-canon-arm64" \
            --matrix-arm64 "${{ steps.gate-arm64.outputs.matrix }}" \
            --profile-arm64 "${{ steps.gate-arm64.outputs.profile }}" \
            --infra-manifest "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/infra-manifest.v1.json" \
            --attestation-dir-x86 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/x86_64/attestations" \
            --attestation-dir-arm64 "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/arm64/attestations" \
            --cross-arch-report "${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/cross-arch.report.v1.json"
      - name: cleanup server evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          record_path="${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}/server-run.v1.json"
          if [[ -f "${record_path}" ]]; then
            "$JCS_TOOL_GO" run -mod=readonly ./cmd/jcs-offline-replay server-cleanup --run-record "${record_path}" || true
          fi
      - name: verify server evidence outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_root="${GITHUB_WORKSPACE}/offline/runs/releases/${GITHUB_REF_NAME}"
          record_path="${run_root}/server-run.v1.json"
          infra_manifest="${run_root}/infra-manifest.v1.json"
          x86_evidence="${run_root}/x86_64/offline-evidence.json"
          arm_evidence="${run_root}/arm64/offline-evidence.json"

          [[ -f "${record_path}" ]] || { echo "::error::missing server run record: ${record_path}"; exit 1; }
          [[ -f "${infra_manifest}" ]] || { echo "::error::missing infra manifest: ${infra_manifest}"; exit 1; }
          [[ -f "${x86_evidence}" ]] || { echo "::error::missing x86_64 evidence: ${x86_evidence}"; exit 1; }
          [[ -f "${arm_evidence}" ]] || { echo "::error::missing arm64 evidence: ${arm_evidence}"; exit 1; }

          destroy_status="$("$JCS_TOOL_JQ" -r '.destroy_status // empty' "${record_path}")"
          if [[ "${destroy_status}" != "succeeded" ]]; then
            echo "::error::server cleanup did not succeed; destroy_status=${destroy_status:-<empty>}"
            exit 1
          fi
      - name: upload server evidence run tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-evidence-run
          path: offline/runs/releases/${{ github.ref_name }}/

  build:
    name: Build Artifacts (${{ matrix.os }})
    needs: [pre_release, server_evidence]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - name: install pinned host toolchain
        shell: bash
        run: |
          set -euo pipefail
          tool_lock="${GITHUB_WORKSPACE}/offline/toolchain.lock.tsv"
          tool_root="${GITHUB_WORKSPACE}/.tmp/toolchain-build"
          host_arch="amd64"

          lookup_tool_field() {
            local artifact_id="$1"
            local field_name="$2"
            awk -F '\t' -v artifact_id="$artifact_id" -v field_name="$field_name" '
              /^#/ || NF == 0 { next }
              $1 == "id" {
                for (i = 1; i <= NF; i++) {
                  idx[$i] = i
                }
                next
              }
              $1 == artifact_id {
                print $(idx[field_name])
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            ' "$tool_lock"
          }

          download_bootstrap_tool() {
            local artifact_id="$1"
            local url sha dest
            url="$(lookup_tool_field "$artifact_id" source_url)"
            sha="$(lookup_tool_field "$artifact_id" sha256)"
            dest="$tool_root/downloads/$artifact_id/$(basename "$url")"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL "$url" -o "$dest"
            if [[ "$(sha256sum "$dest" | awk '{print $1}')" != "$sha" ]]; then
              echo "::error::bootstrap tool sha256 mismatch for ${artifact_id}"
              exit 1
            fi
            printf '%s\n' "$dest"
          }

          bootstrap_go() {
            local artifact_id archive_path extract_root
            artifact_id="go-linux-${host_arch}"
            archive_path="$(download_bootstrap_tool "$artifact_id")"
            extract_root="$tool_root/extracted/$artifact_id"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            tar -xzf "$archive_path" -C "$extract_root"
            printf '%s\n' "$extract_root/go/bin/go"
          }

          go_bin="$(bootstrap_go)"
          "$go_bin" run -mod=readonly ./cmd/jcs-offline-replay sync-toolchain \
            --lock "$tool_lock" \
            --output-dir "$tool_root" \
            --env-file "$tool_root/env.sh" \
            --host-arch "$host_arch" \
            --purposes build,provision,workflow-json-query >/dev/null
          # shellcheck disable=SC1090
          source "$tool_root/env.sh"

          {
            echo "PATH=$(dirname "$JCS_TOOL_GO"):$(dirname "$JCS_TOOL_JQ"):$(dirname "$JCS_TOOL_TOFU"):$PATH"
            echo "JCS_TOOL_GO=$JCS_TOOL_GO"
          } >> "$GITHUB_ENV"
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="jcs-canon"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" -o "dist/${bin}" ./cmd/jcs-canon
          cp LICENSE dist/
          cp NOTICE dist/
          cp README.md dist/
          cp CHANGELOG.md dist/
          bundle="jcs-canon-linux-x86_64.tar.gz"
          bundle_root="${bundle%.tar.gz}"
          bundle_dir=".tmp/release-bundle/${bundle_root}"
          mkdir -p "${bundle_dir}"
          cp "dist/${bin}" "${bundle_dir}/"
          cp LICENSE NOTICE README.md CHANGELOG.md "${bundle_dir}/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 1970-01-01' \
            -C .tmp/release-bundle -czf "dist/${bundle}" "${bundle_root}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jcs-canon-linux
          path: dist/*

  checksums:
    name: Generate Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \( -name 'jcs-canon' -o -name 'jcs-canon-linux-*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  attest:
    name: Attest Build Provenance
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: [jcs-canon-linux]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Attest binary
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/jcs-canon*

  publish:
    name: Publish GitHub Release
    needs: [checksums, attest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: release/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
